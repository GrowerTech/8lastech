services:
  db:
    image: postgres:16-alpine
    container_name: atlas-admin-db
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_password
      POSTGRES_DB: atlas
    ports:
      - "5434:5432"
    volumes:
      - atlas_pgdata:/var/lib/postgresql/data
volumes:
  atlas_pgdata:
